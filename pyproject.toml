[project]
name = "ocd-gd"
version = "0.1.0"
description = "This is the main public repo for Orbital Chaos Detector package"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Asad Arshad", email = "asad.mail@icloud.com" }
]
dependencies = [
    "agama>=1.0.0",
    "astropy>=8.0.0",
    "matplotlib>=3.11.0",
    "numba>=0.65.1",
    "numpy>=2.5.0",
    "plotly>=6.8.0",
    "scipy>=1.18.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "myst-parser>=4.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.0.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
agama = ["numpy", "setuptools", "wheel", "scipy", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "-W ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]